Name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create and Build Cordova App
      run: |
        npm install -g cordova
        cordova create temp_app com.myapp.app MyApp
        cp index.html temp_app/www/ 2>/dev/null || true
        cp script.js temp_app/www/ 2>/dev/null || true
        cp style.css temp_app/www/ 2>/dev/null || true
        cp data.js temp_app/www/ 2>/dev/null || true
        cd temp_app
        cordova platform add android
        cordova build android

    - name: Upload APK File (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: temp_app/platforms/android/app/build/outputs/apk/**/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: temp_app/platforms/android/app/build/outputs/apk/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
