name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create myApp com.example.codeguide CodeGuide
          cd myApp
          rm -rf www/*
          cp ../index.html ../style.css ../script.js ../data.js www/
          cordova platform add android
          cordova build android --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: CodeGuide-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
