<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الأدوات والتحليل السريع للمشاريع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- الهيدر والبحث العلوي -->
        <div class="header-card">
            <div class="top-bar-btns">
                <button id="btn-glossary-sidebar" class="action-btn btn-green">📖 قاموس المصطلحات</button>
                <button id="btn-favorites" class="action-btn btn-orange">⭐ المفضلة</button>
                <button id="btn-history" class="action-btn btn-purple">📜 السجل</button>
            </div>

            <div class="search-title">🔍 البحث السريع</div>
            <div class="search-row">
                <input type="text" id="search-input" placeholder="اسأل عن أي مفهوم أو تقنية...">
                <button id="search-btn" class="action-btn btn-blue">بحث</button>
            </div>
        </div>

        <!-- الموسوعات البرمجية -->
        <div class="section-card">
            <div class="section-header">
                <h3>📚 الموسوعات البرمجية</h3>
            </div>
            <div class="grid-btns">
                <button id="btn-languages" class="item-btn">💻 لغات البرمجة</button>
                <button id="btn-tools" class="item-btn">🛠️ الأدوات والتقنيات</button>
                <button id="btn-ide-apps" class="item-btn">📱 تطبيقات ومحررات الكود</button>
            </div>
        </div>

        <!-- أدوات وتخطيط المشاريع -->
        <div class="section-card">
            <div class="section-header">
                <h3>🚀 أدوات وتخطيط المشاريع</h3>
            </div>
            <textarea id="project-idea" placeholder="اكتب فكرة مشروعك هنا..."></textarea>
            
            <div class="grid-btns">
                <button id="analyze-project-btn" class="item-btn btn-highlight">💡 تحليل الفكرة والتقنيات</button>
                <button id="btn-calculator" class="item-btn">💰 الميزانية والوقت</button>
                <button id="btn-db-generator" class="item-btn">🗄️ هيكل قواعد البيانات</button>
                <button id="btn-code-translator" class="item-btn">🔄 مترجم لغات البرمجة</button>
            </div>
        </div>

        <!-- خرائط طريق المبرمج -->
        <div class="section-card">
            <div class="section-header">
                <h3>🗺️ خرائط طريق المبرمج (Roadmaps)</h3>
            </div>
            <div class="grid-btns">
                <button id="btn-roadmap-web" class="item-btn">🌐 تطوير الويب</button>
                <button id="btn-roadmap-mobile" class="item-btn">📱 تطوير التطبيقات</button>
                <button id="btn-roadmap-ai" class="item-btn">🤖 الذكاء الاصطناعي</button>
            </div>
        </div>
    </div>

    <!-- النافذة المنبثقة الشاملة -->

        <div class="modal-content">
            <div
