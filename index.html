<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البرمجة واستشارة المشاريع</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة html2pdf لتصدير التحليل والملفات إلى PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- زر الوضع الليلي -->
    <button id="theme-toggle-btn">🌙 الوضع الليلي</button>

    <div class="container">
        <header>
            <h1>💡 منصة البرمجة واستشارة المشاريع</h1>
            <p>موسوعة التقنيات، أداة تحليل المشاريع، واستشارات الذكاء الاصطناعي</p>
        </header>

        <!-- قسم البحث والاستفسارات العام -->
        <section class="card">
            <h3>🔍 البحث والاستفسار السريع</h3>
            <div class="input-group">
                <input type="text" id="search-input" placeholder="اسأل عن أي مفهوم برمجي، تقنية، أو مشكلة...">
                <button id="search-btn">بحث</button>
            </div>
        </section>

        <!-- قسم الموسوعات والأدوات -->
        <section class="card">
            <h3>📚 الموسوعات والأدوات البرمجية</h3>
            <div class="button-grid">
                <button id="btn-languages">💻 موسوعة لغات البرمجة</button>
                <button id="btn-tools">🛠️ أدوات وتقنيات التطوير</button>
                <button id="btn-ide-apps">📱 تطبيقات ومحررات الأكواد</button>
            </div>
        </section>

        <!-- قسم تحليل فكرة المشروع -->
        <section class="card">
            <h3>💡 تحليل وتصميم فكرة مشروع</h3>
            <textarea id="project-idea" rows="4" placeholder="اكتب فكرة مشروعك هنا بالتفصيل (مثال: تطبيق لتوصيل الطلبات بين المدن)..."></textarea>
            <button id="analyze-project-btn" style="width: 100%; margin-top: 10px;">🚀 تحليل الفكرة واقتراح التقنيات</button>
        </section>
    </div>

    <!-- النافذة المنبثقة (Modal) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title" style="margin-bottom: 15px; color: #1d4ed8;"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
