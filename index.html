<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البرمجة المباشرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- الهيدر العلوي المتناسق -->
        <div class="main-header">
            <div class="header-text-container">
                <h1>البرمجة المباشرة</h1>
                <p>موسوعة الأدوات والتحليل السريع للمشاريع والقواعد</p>
            </div>
            <button id="btn-glossary-sidebar" class="dict-btn">📖 قاموس المصطلحات</button>
        </div>

        <!-- البحث السريع -->
        <div class="card">
            <div class="card-title">🔍 البحث السريع</div>
            <div class="search-row">
                <button id="search-btn" class="btn-blue">بحث</button>
                <input type="text" id="search-input" placeholder="اسأل عن أي مفهوم أو تقنية...">
            </div>
        </div>

        <!-- الموسوعات البرمجية -->
        <div class="card">
            <div class="card-title">📚 الموسوعات البرمجية</div>
            <div class="btn-list">
                <button id="btn-languages" class="item-btn">💻 لغات البرمجة</button>
                <button id="btn-tools" class="item-btn">🛠️ الأدوات والتقنيات</button>
                <button id="btn-ide-apps" class="item-btn">📱 تطبيقات ومحررات الكود</button>
            </div>
        </div>

        <!-- أدوات وتخطيط المشاريع -->
        <div class="card">
            <div class="card-title">🚀 أدوات وتخطيط المشاريع</div>
            <textarea id="project-idea" placeholder="اكتب فكرة مشروعك أو الكود المراد ترجمته هنا..."></textarea>
            <div class="btn-list">
                <button id="analyze-project-btn" class="item-btn">💡 تحليل الفكرة والتقنيات</button>
                <button id="btn-calculator" class="item-btn">💰 الميزانية والوقت</button>
                <button id="btn-db-generator" class="item-btn">🗄️ هيكل قواعد البيانات</button>
                <button id="btn-code-translator" class="item-btn">🔄 مترجم لغات البرمجة</button>
            </div>
        </div>

        <!-- خرائط طريق المبرمج -->
        <div class="card">
            <div class="card-title">🗺️ خرائط طريق المبرمج (Roadmaps)</div>
            <div class="btn-list">
                <button id="btn-roadmap-web" class="item-btn">🌐 تطوير الويب</button>
                <button id="btn-roadmap-mobile" class="item-btn">📱 تطوير التطبيقات</button>
                <button id="btn-roadmap-ai" class="item-btn">🤖 الذكاء الاصطناعي</button>
            </div>
        </div>
    </div>

    <!-- زر السجل العائم الأنيق في الأسفل -->
    <button id="btn-history" class="floating-history-btn">☰ السجل</button>

    <!-- النافذة المنبثقة Modal (مخفية بالكامل افتراضياً) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title">العنوان</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
