<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المبرمج</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* زر قاموس المصطلحات الأخضر في الأعلى */
        .fixed-glossary-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* زر السجل الأسود العائم في الأسفل */
        .fixed-history-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 14px;
            text-align: center;
            color: #1e293b;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: #ffffff;
            color: #334155;
            text-align: right;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #2563eb;
        }

        .input-area {
            height: 80px;
            resize: none;
            margin-bottom: 12px;
        }

        .btn-blue {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-white {
            background: #ffffff;
            color: #334155;
            border: 1px solid #e2e8f0;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-white:active {
            background: #f8fafc;
        }

        /* النافذة المنبثقة */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            padding: 16px; z-index: 1000;
        }

        .modal.hidden { display: none; }

        .modal-content {
            background: white;
            width: 100%; max-width: 440px;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }

        .modal-body-scroll {
            overflow-y: auto;
            max-height: 65vh;
        }
    </style>
</head>
<body>

    <button id="btn-glossary-sidebar" class="fixed-glossary-btn">📖 قاموس المصطلحات</button>
    <button id="btn-history" class="fixed-history-btn">≡ السجل</button>

    <div style="height: 30px;"></div>

    <!-- البحث السريع -->
    <div class="card">
        <div class="section-title">🔍 البحث السريع</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="اسأل عن أي مفهوم أو تقنية...">
            <button id="search-btn" class="btn-blue">بحث</button>
        </div>
    </div>

    <!-- الموسوعات البرمجية -->
    <div class="card">
        <div class="section-title">📚 الموسوعات البرمجية</div>
        <div class="btn-list">
            <button id="btn-languages" class="btn-white">💻 لغات البرمجة</button>
            <button id="btn-tools" class="btn-white">🛠️ الأدوات والتقنيات</button>
            <button id="btn-ide-apps" class="btn-white">📱 تطبيقات ومحررات الكود</button>
        </div>
    </div>

    <!-- أدوات وتخطيط المشاريع -->
    <div class="card">
        <div class="section-title">🚀 أدوات وتخطيط المشاريع</div>
        <textarea id="project-idea" class="input-area" placeholder="اكتب فكرة مشروعك هنا..."></textarea>
        <div class="btn-list">
            <button id="analyze-project-btn" class="btn-white">💡 تحليل الفكرة والتقنيات</button>
            <button id="btn-calculator" class="btn-white">💰 الميزانية والوقت</button>
            <button id="btn-db-generator" class="btn-white">🗄️ هيكل قواعد البيانات</button>
            <button id="btn-code-translator" class="btn-white">🔄 مترجم لغات البرمجة</button>
        </div>
    </div>

    <!-- خرائط طريق المبرمج -->
    <div class="card">
        <div class="section-title">🗺️ خرائط طريق المبرمج (Roadmaps)</div>
        <div class="btn-list">
            <button id="btn-roadmap-web" class="btn-white">🌐 تطوير الويب</button>
            <button id="btn-roadmap-mobile" class="btn-white">📱 تطوير التطبيقات</button>
            <button id="btn-roadmap-ai" class="btn-white">🤖 الذكاء الاصطناعي</button>
        </div>
    </div>

    <!-- Modal النافذة -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 15px;">عنوان النافذة</h3>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div id="modal-body" class="modal-body-scroll"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
