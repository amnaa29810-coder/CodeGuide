<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار البرمجة الذكي</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>مستشار البرمجة الذكي 🚀</h1>
        </header>

        <!-- قسم البحث والذكاء الاصطناعي -->
        <div class="search-box card">
            <label for="search-input">ابحث عن أي معلومة أو لغة:</label>
            <div class="input-group">
                <input type="text" id="search-input" placeholder="مثال: كيف أبدأ تعلم بايثون؟">
                <button id="search-btn">بحث</button>
            </div>
            <div id="ai-response" class="result-box hidden"></div>
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="actions">
            <button id="btn-languages" class="action-btn">📚 موسوعة اللغات</button>
            <button id="btn-tools" class="action-btn">🛠️ الأدوات البرمجية</button>
            <button id="btn-ide-apps" class="action-btn highlight-btn">📱 تطبيقات تنفيذ الأكواد</button>
        </div>

        <!-- قسم تحليل فكرة المشروع -->
        <div class="project-planner card">
            <h2>💡 حلل فكرة مشروعك بالذكاء الاصطناعي</h2>
            <textarea id="project-idea" rows="3" placeholder="اكتب فكرة مشروعك هنا (مثلاً: تطبيق توصيل طلبات، موقع متجر إلكتروني...)"></textarea>
            <button id="analyze-project-btn">حلل المشروع واقترح التقنيات</button>
            <div id="project-response" class="result-box hidden"></div>
        </div>

        <!-- نافذة عرض اللغات والأدوات والتطبيقات المنبثقة -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-modal" class="close-btn">&times;</span>
                <h2 id="modal-title"></h2>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
