<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار البرمجة الذكي 🚀</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر مع زر القائمة الجانبية -->
    <header class="header">
        <button id="menuBtn" class="menu-icon" onclick="toggleSidebar()">☰</button>
        <h1 class="app-title">مستشار البرمجة الذكي 🚀</h1>
    </header>

    <!-- القائمة الجانبية لحفظ واسترجاع الشات -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>المحادثات السابقة</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">

        <!-- القسم الأول: البحث -->
        <section class="card">
            <label class="card-title">ابحث عن أي معلومة أو لغة:</label>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="">
                <button class="btn-primary" onclick="handleSearch()">بحث</button>
            </div>
            <div id="searchResult" class="result-box"></div>
        </section>

        <!-- القسم الثاني: خيارات سريعة -->
        <section class="quick-buttons">
            <button class="btn-chip">📚 موسوعة اللغات</button>
            <button class="btn-chip">🛠️ الأدوات البرمجية</button>
            <button class="btn-chip">📱 تطبيقات تنفيذ الأكواد</button>
        </section>

        <!-- القسم الثالث: تحليل الفكرة -->
        <section class="card">
            <label class="card-title">💡 حلل فكرة مشروعك بالذكاء الاصطناعي</label>
            <textarea id="projectInput" rows="3" placeholder=""></textarea>
            <button class="btn-action" onclick="analyzeProject()">حلل المشروع واقترح التقنيات</button>
            <div id="projectResult" class="result-box"></div>
        </section>

    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
