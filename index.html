<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار البرمجة الذكي</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <header class="header">
            <h1>💡 مستشار البرمجة الذكي</h1>
            <p>دليلك الذكي لاختيار اللغات، الأدوات، وتحليل أفكار المشروعات البرمجية</p>
        </header>

        <!-- قسم البحث والتفاعل المباشر -->
        <section class="card search-card">
            <h3>🔍 اسأل المستشار الذكي عن أي شيء في البرمجة</h3>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="مثال: ما هي أفضل لغة لبرمجة تطبيقات الذكاء الاصطناعي؟">
                <button id="search-btn">إرسال</button>
            </div>
        </section>

        <!-- الأزرار الثلاثة الرئيسية -->
        <section class="main-buttons-grid">
            <button class="action-btn" id="btn-languages">
                <span class="icon">📚</span>
                <span>موسوعة لغات البرمجة</span>
            </button>
            <button class="action-btn" id="btn-tools">
                <span class="icon">🛠️</span>
                <span>الأدوات البرمجية</span>
            </button>
            <button class="action-btn" id="btn-ide-apps">
                <span class="icon">📱</span>
                <span>تطبيقات ومحررات الأكواد</span>
            </button>
        </section>

        <!-- قسم تحليل فكرة المشروع -->
        <section class="card project-card">
            <h3>💡 حلل فكرة مشروعك بالذكاء الاصطناعي</h3>
            <p>أدخل فكرة تطبيقك أو موقعك وسيقوم الذكاء الاصطناعي باقتراح التقنيات والأدوات وخطة التنفيذ المناسبة.</p>
            <textarea id="project-idea" rows="4" placeholder="اكتب فكرة مشروعك هنا بالتفصيل..."></textarea>
            <button id="analyze-project-btn" class="submit-btn">حلل المشروع واقترح التقنيات</button>
        </section>
    </div>

    <!-- النافذة المنبثقة (Modal) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">العنوان</h3>
                <span id="close-modal" class="close-btn">&times;</span>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- المحتوى يظهر هنا ديناميكياً -->
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
