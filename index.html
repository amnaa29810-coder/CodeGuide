<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة البرمجة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- رأس الصفحة بتصميم ثلاثي الأبعاد (ثلاثة خطوط) -->
    <header class="header-3d">
      <h1>🚀 مستشار البرمجة</h1>
      <p>اسأل عن أي أداة أو لغة</p>
    </header>

    <!-- شريط البحث الفوري -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن لغة، أداة، أو تطبيق...">
      <span class="search-icon">🔍</span>
    </div>

    <!-- مربع السؤال (مخفي بشكل افتراضي، يظهر عند البحث) -->
    <div class="question-card" id="questionCard">
      <textarea id="questionText" placeholder="اكتب سؤالك التفصيلي هنا..."></textarea>
      <div class="card-actions">
        <button onclick="saveQuestion()" class="btn-save">💾 حفظ السؤال</button>
        <button onclick="shareContent()" class="btn-share">📤 مشاركة</button>
        <button onclick="copyLink()" class="btn-copy">📋 نسخ الرابط</button>
      </div>
    </div>

    <!-- عرض النتائج (البطاقات) -->
    <div id="resultsContainer" class="results-grid">
      <!-- ستظهر النتائج هنا عبر JavaScript -->
    </div>

    <!-- قسم المحفوظات (ثلاثي الأبعاد) -->
    <section class="archive-section">
      <h2 onclick="toggleArchive()" class="archive-toggle">📂 الأسئلة المحفوظة (اضغط للعرض)</h2>
      <div id="archiveList" class="archive-list hidden">
        <!-- ستظهر المحفوظات هنا -->
      </div>
    </section>

  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
