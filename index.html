<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- زر الثلاث خطوط للقائمة الجانبية -->
    <header class="header">
        <button id="menuBtn" class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <!-- القائمة الجانبية لعرض المحادثات المحفوظة -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>المحادثات السابقة</h3>
            <button onclick="toggleSidebar()" class="close-btn">✕</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
    </div>

    <!-- حاوية الشات والرسائل -->
    <main class="chat-container">
        <div id="chatBox" class="chat-box"></div>

        <!-- مربع السؤال فارغ بدون placeholder -->
        <div class="input-container">
            <textarea id="userInput" rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
